<div class="modal-overlay">
    <div class="event-form-container">
        <div class="form-header">
            <div class="label-form">{{eventData?'Edit Event':'New Event'}}</div>
            <button class="cancel-icon" (click)="onCancel()"><img src="../../../../assets/icons/x.svg" alt=""></button>
        </div>
        <form (ngSubmit)="onSubmit()" [formGroup]="eventForm" class="event-form">
            <div [class.img-container]="!eventData">
                <input type="file" name="img" src="" id="img" formControlName="image">

                @if(eventData){
                <div class="image-preview">
                    <img [src]="eventData.image" alt="" class="preview-img">
                    <label for="img" class="preview-img-label">Change image</label>
                </div>
                }
                @else {
                <img src="../../../../assets/icons/Image.svg" alt="" id="image-icon">
                <label for="img" class="img-label">Drop an image here or click to upload !</label>
                }
            </div>
            <div class="form-footer">
                <div class="details-container">
                    <div class="eve-name eve-details">
                        <label for="name" class="form-label">Event Name</label>
                        <input type="text" name="name" id="name" formControlName="name" class="input-field"
                            placeholder="Ex. Jhon's birthday">
                    </div>
                    <div class="eve-date eve-details">
                        <label for="date" class="form-label">Event Date</label>
                        <input type="date" name="date" id="date" formControlName="date" class="input-field"
                            [placeholder]="eventData?.date?eventData?.date:'Select a date...'">
                    </div>
                    <div class="eve-cat eve-details">
                        <label for="category" class="form-label">Event Category</label>
                        <div class="category-list">
                            <div class="cat-label input-field" (click)="expandCategory()">
                                <div class="selected-value">{{selectedCategory?selectedCategory:'Select a option'}}
                                </div>
                                <img src="../../../../assets/icons/Arrow - Bottom.svg" alt="">
                            </div>
                            <ul [class]="categoryExpanded ? 'category-ul-expanded' : 'category-ul' "
                                click="chooseCategory()">
                                <li *ngFor="let option of categoryOptions" (click)="chooseCategory(option.label)"
                                    [class]="selectedCategory===option.value ? 'selected' : 'lists'">
                                    {{option.label}}
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>

                <div class="eve-btn">
                    <button type="button" class="btn-cancel btn" (click)="onCancel()"> Cancel </button>
                    <button type="submit" [disabled]="eventForm.invalid" class="btn-save btn">{{eventData?'Save
                        Changes':'Save'}}</button>
                </div>

            </div>
        </form>
    </div>
</div>
