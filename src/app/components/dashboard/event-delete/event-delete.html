<div class="event-delete-container">
    <div class="delete-header">
        <div class="label-delete">Delete ?</div>
        <button class="cancel-icon" (click)="onCancel()"><img src="../../../../assets/icons/x.svg" alt="close"></button>
    </div>
    <p class="delete-message">Are you sure you want to delete this event ?</p>
    <div class="delete-image-container">
        <img src="../../../../assets/images/delete-image.svg" alt="delete illustration" class="delete-illustration">
    </div>
    <div class="delete-btn-group">
        <button type="button" class="btn-cancel btn" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn-delete btn" (click)="onDelete()">Delete</button>
    </div>
</div>
